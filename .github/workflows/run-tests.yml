name: run-tests

on:
  push:
  pull_request:

jobs:
  test:
    if: "github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository"

    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          MONGO_INITDB_DATABASE: activitylog_test

    strategy:
      fail-fast: false
      matrix:
        php: ['8.6', '8.5', '8.4']
        laravel: [^13.32]
        dependency-version: [prefer-lowest, prefer-stable]
        include:
          - laravel: ^13.32
            testbench: ^11.0
            pest: ^5.3.5

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - Pest ${{ matrix.pest }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Start MongoDB replica set
        run: |
          docker exec ${{ job.services.mongodb.id }} mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
          docker exec ${{ job.services.mongodb.id }} mongosh --quiet --eval 'while (!db.hello().isWritablePrimary) { sleep(1000) }'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo, mongodb
          coverage: none

      - name: Verify PHP version
        env:
          EXPECTED_PHP_VERSION: ${{ matrix.php }}
        run: |
          php -r 'echo PHP_VERSION, PHP_EOL; exit(PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION === getenv("EXPECTED_PHP_VERSION") ? 0 : 1);'

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" --dev --no-interaction --no-update
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Execute tests
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DATABASE: activitylog_test
        run: vendor/bin/pest
